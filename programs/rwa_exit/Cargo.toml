[package]
name = "rwa_exit"
version = "0.1.0"
description = "Prop RFQ research artifact derived from OnRe's Solana program"
license = "MIT"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_exit"

[features]
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
mainnet-test = []
devnet-test = []
devnet-dev = []



[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
bytemuck = { version = "1.25.2", features = ["min_const_generics"] }
cfg-if = "1.0.4"
solana-program = "4.0.0"
solana-instructions-sysvar = "4.0.0"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = { version = "0.14.0", features = ["precompiles", "register-tracing"] }
solana-address-lookup-table-interface = { version = "3.1.0", features = ["bincode"] }
solana-compute-budget-interface = "3.0.0"
solana-sdk = "4.0.1"
